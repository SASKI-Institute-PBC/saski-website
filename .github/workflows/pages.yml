name: Deploy Pages preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build static site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://saski-institute-pbc.github.io/saski-website' }}
          SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE || 'false' }}
          GOOGLE_ANALYTICS_ID: ${{ vars.GOOGLE_ANALYTICS_ID || 'G-KN2FB37JB4' }}
        run: python3 scripts/build.py
      - run: python3 scripts/check.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
