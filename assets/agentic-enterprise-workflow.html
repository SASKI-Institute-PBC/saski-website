<style>html,body{margin:0;background:#070B14}body{padding:8px}</style>
<div class="saski-dashboard">
  <style>
    .saski-dashboard {
      width: 100%;
      max-width: 1024px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      background: #070B14;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      box-sizing: border-box;
    }

    .saski-dashboard svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Prevent SVG stroke inheritance on text glyphs */
    .saski-dashboard text {
      stroke: none !important;
    }

    /* 13.2s Master Loop (10% slowed from 12s): ALLOW (0s-4.4s) | HOLD (4.4s-8.8s) | DENY (8.8s-13.2s) */

    @keyframes orbitPulse {
      0%, 33.3%, 66.6%, 100% { stroke-dashoffset: 260; opacity: 0.3; }
      4%, 10%, 37%, 43%, 70%, 76% { stroke-dashoffset: 0; opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      14%, 47%, 80% { opacity: 0.3; }
    }

    /* Live Proposal Inspector Cross-Fades */
    @keyframes inspectAllowCycle {
      0%, 30% { opacity: 1; visibility: visible; }
      33.3%, 100% { opacity: 0; visibility: hidden; }
    }

    @keyframes inspectHoldCycle {
      0%, 33.3% { opacity: 0; visibility: hidden; }
      36.6%, 63.3% { opacity: 1; visibility: visible; }
      66.6%, 100% { opacity: 0; visibility: hidden; }
    }

    @keyframes inspectDenyCycle {
      0%, 66.6% { opacity: 0; visibility: hidden; }
      70%, 96.6% { opacity: 1; visibility: visible; }
      100% { opacity: 0; visibility: hidden; }
    }

    /* Data Packet Trajectories */
    @keyframes packetAllow {
      0%, 100% { opacity: 0; transform: translate(280px, 570px); }
      5% { opacity: 1; transform: translate(280px, 570px); }
      12% { opacity: 1; transform: translate(390px, 260px); }
      18% { opacity: 1; transform: translate(500px, 535px); }
      24% { opacity: 1; transform: translate(750px, 250px); }
      30% { opacity: 0; transform: translate(780px, 250px); }
    }

    @keyframes packetHold {
      0%, 33% { opacity: 0; transform: translate(280px, 570px); }
      38% { opacity: 1; transform: translate(280px, 570px); }
      45% { opacity: 1; transform: translate(390px, 350px); }
      51% { opacity: 1; transform: translate(500px, 535px); }
      57% { opacity: 1; transform: translate(750px, 460px); }
      63% { opacity: 0; transform: translate(780px, 460px); }
      100% { opacity: 0; }
    }

    @keyframes packetDeny {
      0%, 66% { opacity: 0; transform: translate(280px, 570px); }
      71% { opacity: 1; transform: translate(280px, 570px); }
      78% { opacity: 1; transform: translate(390px, 200px); }
      84% { opacity: 1; transform: translate(500px, 535px); }
      90% { opacity: 1; transform: translate(750px, 670px); }
      96% { opacity: 0; transform: translate(780px, 670px); }
      100% { opacity: 0; }
    }

    /* 5 Invariant Gates */
    @keyframes gateCheck1 {
      0%, 100% { fill: #1e293b; stroke: #475569; }
      10%, 30%, 43%, 63%, 76%, 95% { fill: #064e3b; stroke: #10b981; }
    }
    @keyframes gateCheck2 {
      0%, 100% { fill: #1e293b; stroke: #475569; }
      12%, 30%, 45%, 63% { fill: #064e3b; stroke: #10b981; }
      80%, 95% { fill: #450a0a; stroke: #ef4444; }
    }
    @keyframes gateCheck3 {
      0%, 100% { fill: #1e293b; stroke: #475569; }
      14%, 30%, 47%, 63% { fill: #064e3b; stroke: #10b981; }
    }
    @keyframes gateCheck4 {
      0%, 100% { fill: #1e293b; stroke: #475569; }
      16%, 30%, 49%, 63% { fill: #064e3b; stroke: #10b981; }
    }
    @keyframes gateCheck5 {
      0%, 100% { fill: #1e293b; stroke: #475569; }
      18%, 30% { fill: #064e3b; stroke: #10b981; }
      51%, 63% { fill: #451a03; stroke: #f59e0b; }
    }

    /* Deterministic Verdict Badges */
    @keyframes pillAllowState {
      0%, 15%, 31%, 100% { opacity: 0.25; fill: #0a141d; stroke: #1e293b; stroke-width: 1.5; filter: none; }
      17%, 29% { opacity: 1; fill: #064e3b; stroke: #10b981; stroke-width: 2.5; filter: drop-shadow(0 0 12px #10b981); }
    }
    @keyframes textAllowState {
      0%, 15%, 31%, 100% { fill: #475569; }
      17%, 29% { fill: #34d399; }
    }

    @keyframes pillHoldState {
      0%, 48%, 64%, 100% { opacity: 0.25; fill: #0a141d; stroke: #1e293b; stroke-width: 1.5; filter: none; }
      50%, 62% { opacity: 1; fill: #451a03; stroke: #f59e0b; stroke-width: 2.5; filter: drop-shadow(0 0 12px #f59e0b); }
    }
    @keyframes textHoldState {
      0%, 48%, 64%, 100% { fill: #475569; }
      50%, 62% { fill: #fbbf24; }
    }

    @keyframes pillDenyState {
      0%, 81%, 97%, 100% { opacity: 0.25; fill: #0a141d; stroke: #1e293b; stroke-width: 1.5; filter: none; }
      83%, 95% { opacity: 1; fill: #450a0a; stroke: #ef4444; stroke-width: 2.5; filter: drop-shadow(0 0 12px #ef4444); }
    }
    @keyframes textDenyState {
      0%, 81%, 97%, 100% { fill: #475569; }
      83%, 95% { fill: #f87171; }
    }

    /* Receipt Block Fade */
    @keyframes receiptFade {
      0%, 15% { opacity: 0.4; stroke: #1e293b; }
      20%, 30% { opacity: 1; stroke: #10b981; filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.25)); }
      35%, 48% { opacity: 0.4; stroke: #1e293b; }
      53%, 63% { opacity: 1; stroke: #f59e0b; filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.25)); }
      68%, 81% { opacity: 0.4; stroke: #1e293b; }
      86%, 96% { opacity: 1; stroke: #ef4444; filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.25)); }
    }

    /* Financial Targets */
    @keyframes targetPaymentRails {
      0%, 20%, 32%, 100% { stroke: #1e293b; fill: #0c1322; filter: none; }
      22%, 30% { stroke: #10b981; fill: #064e3b; filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.4)); }
    }
    @keyframes targetOfficerApproval {
      0%, 53%, 65%, 100% { stroke: #1e293b; fill: #0c1322; filter: none; }
      55%, 63% { stroke: #f59e0b; fill: #451a03; filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.4)); }
    }
    @keyframes targetSafeStopRect {
      0%, 86%, 98%, 100% { stroke: #1e293b; fill: #0c1322; filter: none; }
      88%, 96% { stroke: #ef4444; fill: #450a0a; filter: drop-shadow(0 0 12px rgba(239, 68, 68, 0.4)); }
    }

    /* 13.2s Slowed Animation Rules */
    .anim-orbit { animation: orbitPulse 13.2s infinite linear; }
    .anim-inspect-allow { animation: inspectAllowCycle 13.2s infinite ease-in-out; }
    .anim-inspect-hold { animation: inspectHoldCycle 13.2s infinite ease-in-out; }
    .anim-inspect-deny { animation: inspectDenyCycle 13.2s infinite ease-in-out; }
    .anim-packet-allow { animation: packetAllow 13.2s infinite ease-out; }
    .anim-packet-hold { animation: packetHold 13.2s infinite ease-out; }
    .anim-packet-deny { animation: packetDeny 13.2s infinite ease-out; }
    .anim-gate-1 { animation: gateCheck1 13.2s infinite; }
    .anim-gate-2 { animation: gateCheck2 13.2s infinite; }
    .anim-gate-3 { animation: gateCheck3 13.2s infinite; }
    .anim-gate-4 { animation: gateCheck4 13.2s infinite; }
    .anim-gate-5 { animation: gateCheck5 13.2s infinite; }
    .anim-box-allow { animation: pillAllowState 13.2s infinite ease-in-out; }
    .anim-txt-allow { animation: textAllowState 13.2s infinite ease-in-out; }
    .anim-box-hold { animation: pillHoldState 13.2s infinite ease-in-out; }
    .anim-txt-hold { animation: textHoldState 13.2s infinite ease-in-out; }
    .anim-box-deny { animation: pillDenyState 13.2s infinite ease-in-out; }
    .anim-txt-deny { animation: textDenyState 13.2s infinite ease-in-out; }
    .anim-receipt-box { animation: receiptFade 13.2s infinite; }
    .anim-rect-rails { animation: targetPaymentRails 13.2s infinite; }
    .anim-rect-officer { animation: targetOfficerApproval 13.2s infinite; }
    .anim-rect-stop { animation: targetSafeStopRect 13.2s infinite; }

    @media (prefers-reduced-motion: reduce) {
      .saski-dashboard [class*="anim-"] {
        animation-play-state: paused !important;
        animation-delay: -3.2s !important;
      }
    }
  </style>
